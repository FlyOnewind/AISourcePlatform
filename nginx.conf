# 知识库系统 Nginx 反向代理 — HTTP/2 前端 + uvicorn HTTP/1.1 后端

events {
    worker_connections 1024;
}

http {
    client_max_body_size 128m;

    # 全局代理头
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 600s;
    proxy_connect_timeout 10s;

    # gzip 压缩 — 前端静态资源 + API JSON 响应
    gzip on;
    gzip_types text/css application/javascript text/html application/json;
    gzip_min_length 256;

    server {
        listen 80;
        http2 on;

        # 资源代理：透传 MinIO 预签名 URL，供外部直接访问
        location /assets/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://minio:9000/kb-assets/;
        }

        # API 路由：HTTP/1.1 持久连接 + 关闭缓冲以支持 SSE 长连接推送
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://host.docker.internal:8000;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }

        # 前端 SPA + 静态文件
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://host.docker.internal:8000;
        }
    }
}
