[project]
name = "kb-platform"
version = "0.1.0"
description = "AI知识库管理中台 - V1 本地可运行版"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server,grpc]>=1,<2",
    "alembic>=1.14,<2",
    "fastapi>=0.115.0",
    "grpcio>=1.74,<2",
    "grpcio-reflection>=1.74,<2",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
    "redis>=5.1.0",
    "qdrant-client>=1.11.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "jmespath>=1,<2",
    "jsonschema>=4.23,<5",
    "mcp>=1.27,<2",
    "python-multipart>=0.0.12",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "markdown-it-py>=3.0.0",
    "openai>=1.50.0",
    "protobuf>=5,<7",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "sdk/kb_platform_sdk"]
