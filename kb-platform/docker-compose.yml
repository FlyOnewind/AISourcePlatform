version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kb_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kbplatform
      POSTGRES_PASSWORD: kbplatform
      POSTGRES_DB: kbplatform
    ports:
      - "5432:5432"
    volumes:
      - kb_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbplatform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kb_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.4
    container_name: kb_platform_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - kb_qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: kb_platform_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kbplatform
      MINIO_ROOT_PASSWORD: kbplatform123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kb_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kb_pg_data:
  kb_qdrant_data:
  kb_minio_data:
